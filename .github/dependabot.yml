# Weekly dependency updates, one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
