# Weekly dependency updates, one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  # CI's hash-locked requirements: ci/*.in compiled to ci/*.txt by uv pip compile (Dependabot relocks with hashes)
  - package-ecosystem: uv
    directory: /ci
    schedule:
      interval: weekly
    groups:
      ci-python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
