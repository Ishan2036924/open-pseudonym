name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "./sdk/python[proxy,mcp,openai,anthropic,test]" "jsonschema>=4.18"
      - run: python tools/sync_data.py --check
      - run: PYTHONPATH=sdk/python/src python -m open_pseudonym.conformance vectors
      - name: unit, proxy, MCP and SDK client tests (the browser tests skip without Chromium)
        run: cd sdk/python && python -m pytest -q -rs
      - run: python tools/check_schemas.py
      - name: vector generator agrees with the SDK
        run: python tools/make_vectors.py && git diff --exit-code vectors
      - name: offline benchmark runs
        run: python bench/run.py offline --out /tmp/offline.md
      - name: the package builds
        if: matrix.python == '3.13'
        run: python -m pip install "build>=1.2" && python -m build --outdir dist-py sdk/python && ls dist-py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "./sdk/python[browser,test]" "playwright==1.58.0"
      - run: python -m playwright install --with-deps chromium
      - name: handle filler against headless Chromium and a local test site
        run: cd sdk/python && python -m pytest -q tests/test_browser.py

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: type-check and build
        run: npm run build
      - run: node src/conformance.ts ../../vectors
      - run: node dist/conformance.js ../../vectors
      - run: npm test
      - run: npm pack --dry-run
