name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: dependencies from the hash-locked ci/test.txt
        run: python -m pip install --require-hashes -r ci/test.txt
      - name: the SDK itself, from a wheel built with the locked setuptools (nothing unhashed is fetched)
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist ./sdk/python && python -m pip install --no-deps dist/*.whl
      - run: python tools/sync_data.py --check
      - run: PYTHONPATH=sdk/python/src python -m open_pseudonym.conformance vectors
      - name: unit, proxy, MCP and SDK client tests (the browser tests skip without Chromium)
        run: cd sdk/python && python -m pytest -q -rs
      - run: python tools/check_schemas.py
      - name: release signing fetches only bytes that match the registries' digests
        run: python tools/test_fetch_published.py
      - name: CI installs are hash-locked and the locks cover every SDK extra a job tests
        if: matrix.python == '3.13'
        run: python tools/check_ci_locks.py && python tools/test_check_ci_locks.py
      - name: vector generator agrees with the SDK
        run: python tools/make_vectors.py && git diff --exit-code vectors
      - name: offline benchmark runs
        run: python bench/run.py offline --out /tmp/offline.md
      - name: the package builds
        if: matrix.python == '3.13'
        run: python -m build --no-isolation --outdir dist-py sdk/python && ls dist-py

  litellm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: dependencies from the hash-locked ci/litellm.txt (LiteLLM pinned to the tested release)
        run: python -m pip install --require-hashes -r ci/litellm.txt
      - name: the SDK itself, from a wheel built with the locked setuptools (nothing unhashed is fetched)
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist ./sdk/python && python -m pip install --no-deps dist/*.whl
      - name: guardrail unit tests and end to end through the real LiteLLM proxy (fake model, no network)
        run: cd sdk/python && python -m pytest -q -rs tests/test_litellm.py tests/test_litellm_e2e.py tests/test_proxy.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: dependencies from the hash-locked ci/browser.txt
        run: python -m pip install --require-hashes -r ci/browser.txt
      - name: the SDK itself, from a wheel built with the locked setuptools (nothing unhashed is fetched)
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist ./sdk/python && python -m pip install --no-deps dist/*.whl
      - run: python -m playwright install --with-deps chromium
      - name: handle filler against headless Chromium and a local test site
        run: cd sdk/python && python -m pytest -q tests/test_browser.py

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: type-check and build
        run: npm run build
      - run: node src/conformance.ts ../../vectors
      - run: node dist/conformance.js ../../vectors
      - run: npm test
      - run: npm pack --dry-run
